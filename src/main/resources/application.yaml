server:
  port: 8080

spring:
  application:
    name: payment-collection
  profiles:
    active: local #TODO: split application.yaml for env.

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_collection_db
    username: payment_user
    password: payment_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop #TODO: change this later.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql

  data:
    jpa:
      repositories:
        enabled: true

  flyway:
    enabled: false  # fist disabled, make enabled when ready to migraiton
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

security:
  jwt:
    secret: ThisIsAVeryLongSecretKeyForHS512AlgorithmThatMustBeAtLeast64CharactersLongToBeSecureEnoughForJWTSigning2024
    expiration-ms: 604800000

logging:
  level:
    com.eny.paymentcollection: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
